# SPDX-License-Identifier: CC0-1.0
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Test the AT tool against a fake modem
        run: python3 serial-driver/tools/test_quectel_at.py
      - name: Test the QMI tool against a simulated modem
        run: python3 qmi-userspace/test_qmi.py
      - name: Build and test the menu bar app
        run: swift test --package-path modem-gui && swift build --package-path modem-gui -c release
      - name: Bundle the apps
        run: modem-gui/scripts/bundle.sh --dmg
      - name: Check the app bundles
        run: |
          cd modem-gui/build
          for app in QuectelMenu QuectelDebug; do
            codesign --verify --strict --verbose=2 "$app.app"
            plutil -p "$app.app/Contents/Info.plist"
            test -s "$app.app/Contents/Resources/AppIcon.icns"
            # Without this key System Information lists the app as iOS.
            test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$app.app/Contents/Info.plist")" = MacOSX
          done
          # Right after the image is made, attach can fail with
          # "Resource temporarily unavailable"; give it a few tries.
          for try in 1 2 3 4 5; do
            hdiutil attach -nobrowse -readonly -mountpoint mnt QuectelApps.dmg && break
            [ "$try" -lt 5 ] || exit 1
            sleep 3
          done
          ls -l mnt
          codesign --verify --strict mnt/QuectelMenu.app mnt/QuectelDebug.app
          test "$(readlink mnt/Applications)" = /Applications
          hdiutil detach mnt
      - name: Upload the apps
        uses: actions/upload-artifact@v4
        with:
          name: quectel-apps
          path: modem-gui/build/QuectelApps.dmg
      - name: Compile driver and installer (unsigned)
        run: serial-driver/scripts/build.sh --unsigned

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: Fuzz the driver against the fake DriverKit
        run: serial-driver/fuzz/run.sh 60
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: serial-driver/fuzz/build/crash-*
