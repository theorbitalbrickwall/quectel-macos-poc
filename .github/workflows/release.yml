# SPDX-License-Identifier: CC0-1.0
# Runs when a version tag (v1.2.3) is pushed: builds the two apps, signs them
# with the Developer ID certificate, has Apple notarise them and publishes the
# disk image as a GitHub release. The secrets it needs are listed in
# modem-gui/README.md. The serial driver is not part of a release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Take the version from the tag
        run: |
          # v1.2.3 or v1.2.3-rc1; the part after the dash makes a pre-release.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $TAG is not a version like v1.2.3 or v1.2.3-rc1."
            exit 1
          fi
          version=${TAG#v}
          echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
          echo "VERSION=${version%%-*}" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac
      - name: Check that the secrets are set
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
              NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing"
            exit 1
          fi
      - name: Run the Python and Swift tests
        run: make test
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A keychain of its own, with a password nobody needs to know.
          password=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/developer-id.p12"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$p12" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\) "Developer ID Application: .*/\1/p' |
            head -1)
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 holds no Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notarisation key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
      - name: Build, sign and notarise the apps
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          BUILD: ${{ github.run_number }}
          ARCHS: arm64 x86_64
        run: make dmg
      - name: Check the signatures and the notarisation
        run: |
          cd modem-gui/build
          for app in QuectelMenu QuectelDebug; do
            codesign --verify --deep --strict --verbose=2 "$app.app"
            xcrun stapler validate "$app.app"
            spctl --assess --type execute --verbose=2 "$app.app"
            test "$(plutil -extract CFBundleShortVersionString raw "$app.app/Contents/Info.plist")" = "$VERSION"
            lipo -archs "$app.app/Contents/MacOS/$app"
          done
          xcrun stapler validate QuectelApps.dmg
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 QuectelApps.dmg
          mv QuectelApps.dmg "QuectelApps-${TAG#v}.dmg"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg="modem-gui/build/QuectelApps-${TAG#v}.dmg"
          # A release drafted or published by hand for this tag gets the disk
          # image added; otherwise the release is made here.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$dmg" --verify-tag --title "$TAG" \
              --generate-notes $PRERELEASE
          fi
      - name: Remove the certificate and the key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$NOTARY_KEY"
